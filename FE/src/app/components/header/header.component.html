<header id="header">
    <div class="container">
        <div class="row" id="headwrap">
            <div class="col-md-3 col-sm-6 slogan">
                <h1 class="site-title"><a class="logo" href="./index.html" rel="home">Hoạt Hình Kungfu</a>
                </h1>
            </div>
            <div class="col-md-5 col-sm-6 halim-search-form hidden-xs">
                <div class="header-nav">
                    <div class="col-xs-12">
                        <!--tìm kiếm phim-->
                        <form id="search-form-pc" name="halimForm" role="search" method="GET">
                            <div class="form-group">
                                <div class="input-group col-xs-12">
                                    <input id="search" type="text" name="s" value="" class="form-control"
                                        data-toggle="tooltip" data-placement="bottom"
                                        data-original-title="Nhấn Enter để tìm kiếm"
                                        placeholder="Nhập tên phim cần tìm..." autocomplete="off" required>
                                    <i class="animate-spin hl-spin4 hidden"></i>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4 hidden-xs" style="display: flex;">
                <a id="get-bookmark" class="box-shadow" href="./lichsuxemphim.html"><i
                        class="hl-bookmark"></i><span>Lịch sử xem
                        phim</span></a>
                <div id="bookmark-list" class="hidden bookmark-list-on-pc">
                    <ul style="margin: 0;"></ul>
                </div>
                <script src="https://unpkg.com/ionicons@5.5.2/dist/ionicons.js"></script>
                <div class="dropdown ml-auto">
                    <img style="border-radius: 50%; width: 40px; height: 40px;" src="./../view/images/avatar.jpg" alt=""
                        id="profileImage">

                    <style>
                        a {
                            text-align: left;
                        }

                        .dropdown {
                            position: relative;
                            display: inline-block;
                        }

                        .dropdown-content {
                            display: none;
                            position: absolute;
                            background-color: white;
                            min-width: 160px;
                            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
                            z-index: 1;
                        }

                        .dropdown-content a {
                            color: black;
                            padding: 12px 16px;
                            text-decoration: none;
                            display: block;
                        }

                        .dropdown-content a:hover {
                            background-color: #ddd;
                        }

                        .show {
                            display: block;
                        }
                    </style>

                </div>


            </div>
        </div>
    </div>
</header>
<div class="navbar-container">
    <div class="container">
        <nav class="navbar halim-navbar main-navigation" role="navigation" data-dropdown-hover="1">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed pull-left" data-toggle="collapse"
                    data-target="#halim" aria-expanded="false">
                    <span class="sr-only">Menu</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <button type="button" class="navbar-toggle collapsed pull-right" data-toggle="collapse"
                    data-target="#user-info" aria-expanded="false">
                    <span class="hl-dot-3 rotate" aria-hidden="true"></span>
                </button>
                <button type="button" class="navbar-toggle collapsed pull-right expand-search-form"
                    data-toggle="collapse" data-target="#search-form" aria-expanded="false">
                    <span class="hl-search" aria-hidden="true"></span>
                </button>
                <button type="button" class="navbar-toggle collapsed pull-right get-bookmark-on-mobile">
                    <i class="hl-bookmark" aria-hidden="true"></i>
                    <span class="count">0</span>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="halim">
                <div class="menu-menu-container">
                    <!--Danh sách thể loại-->
                    <ul *ngFor="let item of Items" id="menu-menu" class="nav navbar-nav navbar-left">
                        <li>
                            <a data-tenlp="">{{item.tenLp}}</a>
                        </li>
                    </ul>

                </div>
                <script src="js/phimbytheloai.js"></script>
            </div>

        </nav>
        <div class="collapse navbar-collapse" id="search-form">
            <div id="mobile-search-form" class="halim-search-form"></div>
        </div>
        <div class="collapse navbar-collapse" id="user-info">
            <div id="mobile-user-login"></div>
        </div>
    </div>
</div>
